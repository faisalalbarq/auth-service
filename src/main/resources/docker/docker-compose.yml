name: auth-service

services:
  postgres:
    container_name: faisal-postgresql
    image: citusdata/citus:13.2.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Z1s152easpwu}
      POSTGRES_USER: faisal_user
      POSTGRES_DB: faisal_db
    ports:
      - "5677:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: faisal-redis
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6993:6379"
    command: redis-server --notify-keyspace-events Ex
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: